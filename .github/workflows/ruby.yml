name: Ruby build and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check dependency advisories
        run: bundle exec bundler-audit check --update
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
